name: Keep Render Awake

# GitHub's scheduler is best-effort: runs can be delayed or skipped. Keep this as one of two pingers
# and add an external monitor (see README, "Keeping the free tier awake").
on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (GitHub's minimum)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping health endpoint (wakes a sleeping instance)
        run: |
          # A cold start on Render free can take 50s+ and the first requests may time out, so retry patiently.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 75 "https://hexalog-capi-service.onrender.com/health"; then
              echo "Ping succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "All attempts failed"
          exit 1
